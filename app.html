<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Life Brand Church — Giving Light</title>
    <meta name="description" content="Life Brand Church, Ogba, Ikeja, Lagos. Pastor Oyebola Ajao. Giving Light to the community and nations." />
    <link rel="icon" type="image/png" href="/images/header/logo.png" />
    <link rel="shortcut icon" type="image/png" href="/images/header/logo.png" />
    <link rel="apple-touch-icon" href="/images/header/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      /* ─── Reset ─────────────────────────────────── */
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0a1628; }

      /* ─── Loading Screen ─────────────────────────── */
      #ls {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #0a1628;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        transition: opacity 0.7s cubic-bezier(.4,0,.2,1), visibility 0.7s;
      }
      #ls.hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* Background radial torch glow */
      .ls-bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 70% 70% at 50% 48%,
            rgba(229,69,43,0.1) 0%,
            rgba(0,70,140,0.09) 40%,
            transparent 72%
          );
        animation: ls-bg-breathe 3.5s ease-in-out infinite;
      }
      @keyframes ls-bg-breathe {
        0%, 100% { opacity: 0.75; transform: scale(1);    }
        50%       { opacity: 1;    transform: scale(1.08); }
      }

      /* Cross lines of light */
      .ls-cross-v {
        position: absolute;
        top: 0; bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 1px;
        background: linear-gradient(to bottom,
          transparent 0%,
          rgba(229,69,43,0.22) 30%,
          rgba(0,102,204,0.22) 70%,
          transparent 100%
        );
        animation: ls-fade-in 1.2s ease 0.2s both;
      }
      .ls-cross-h {
        position: absolute;
        left: 0; right: 0;
        top: 48%;
        transform: translateY(-50%);
        height: 1px;
        background: linear-gradient(to right,
          transparent 5%,
          rgba(0,102,204,0.14) 35%,
          rgba(229,69,43,0.1) 50%,
          rgba(0,102,204,0.14) 65%,
          transparent 95%
        );
        animation: ls-fade-in 1.2s ease 0.4s both;
      }
      @keyframes ls-fade-in {
        from { opacity: 0; }
        to   { opacity: 1; }
      }

      /* Expanding light rings */
      .ls-ring {
        position: absolute;
        top: 48%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.15);
        width: 340px;
        height: 340px;
        border-radius: 50%;
        border: 1px solid rgba(229, 69, 43, 0.3);
        opacity: 0;
        animation: ls-ring-out 2.8s ease-out infinite;
      }
      .ls-ring:nth-of-type(1) { animation-delay: 0s;    border-color: rgba(229,69,43,0.3); }
      .ls-ring:nth-of-type(2) { animation-delay: 0.9s;  border-color: rgba(255,150,60,0.25); }
      .ls-ring:nth-of-type(3) { animation-delay: 1.8s;  border-color: rgba(0,102,204,0.2); }
      @keyframes ls-ring-out {
        0%   { transform: translate(-50%,-50%) scale(0.15); opacity: 0;   }
        8%   { opacity: 0.9; }
        100% { transform: translate(-50%,-50%) scale(2.6);  opacity: 0;   }
      }

      /* Floating light particles */
      .ls-particle {
        position: absolute;
        border-radius: 50%;
        background: rgba(229, 69, 43, 0.45);
        animation: ls-drift linear infinite;
      }
      @keyframes ls-drift {
        0%   { opacity: 0;   transform: translateY(0)    rotate(0deg);   }
        10%  { opacity: 0.8; }
        90%  { opacity: 0.4; }
        100% { opacity: 0;   transform: translateY(-60px) rotate(180deg); }
      }

      /* ── Centre content ── */
      .ls-center {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      /* Warm halo behind logo */
      .ls-halo {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background: radial-gradient(circle,
          rgba(255,200,100,0.22) 0%,
          rgba(229,69,43,0.14) 40%,
          transparent 70%
        );
        animation: ls-halo-pulse 2.2s ease-in-out infinite;
      }
      @keyframes ls-halo-pulse {
        0%, 100% { transform: translate(-50%,-50%) scale(1);    opacity: 0.65; }
        50%       { transform: translate(-50%,-50%) scale(1.35); opacity: 1;    }
      }

      /* Logo */
      .ls-logo {
        position: relative;
        z-index: 2;
        width: 88px;
        height: 88px;
        object-fit: contain;
        filter: drop-shadow(0 0 12px rgba(255,190,80,0.45));
        animation:
          ls-logo-in   0.75s cubic-bezier(.22,1,.36,1) 0.15s both,
          ls-logo-glow 2.6s  ease-in-out              0.9s  infinite;
      }
      @keyframes ls-logo-in {
        from { opacity: 0; transform: scale(0.45) translateY(10px); }
        to   { opacity: 1; transform: scale(1)    translateY(0);     }
      }
      @keyframes ls-logo-glow {
        0%, 100% {
          filter: drop-shadow(0 0 10px rgba(255,190,80,0.4))
                  drop-shadow(0 0  3px rgba(229,69,43,0.4));
        }
        50% {
          filter: drop-shadow(0 0 28px rgba(255,210,110,0.85))
                  drop-shadow(0 0 10px rgba(229,69,43,0.75))
                  drop-shadow(0 0 40px rgba(255,160,50,0.3));
        }
      }

      /* Church name */
      .ls-name {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 1.75rem;
        font-weight: 300;
        color: #ffffff;
        letter-spacing: 0.06em;
        margin-top: 22px;
        animation: ls-slide-up 0.75s cubic-bezier(.22,1,.36,1) 0.55s both;
      }
      .ls-name em {
        font-style: normal;
        color: #5ba3de;
      }

      /* Divider */
      .ls-sep {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 14px;
        animation: ls-slide-up 0.65s ease 0.8s both;
      }
      .ls-sep-line {
        width: 36px;
        height: 1px;
        background: linear-gradient(to right, transparent, rgba(229,69,43,0.5));
      }
      .ls-sep-line:last-child {
        background: linear-gradient(to left, transparent, rgba(229,69,43,0.5));
      }
      .ls-sep-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #e5452b;
        box-shadow: 0 0 8px rgba(229,69,43,0.8);
        animation: ls-dot-pulse 1.6s ease-in-out infinite;
      }
      @keyframes ls-dot-pulse {
        0%, 100% { box-shadow: 0 0 6px rgba(229,69,43,0.6);  transform: scale(1);    }
        50%       { box-shadow: 0 0 18px rgba(229,69,43,0.9); transform: scale(1.35); }
      }

      /* Tagline */
      .ls-tagline {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 0.6rem;
        font-weight: 700;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: #e5452b;
        margin-top: 10px;
        animation: ls-slide-up 0.65s ease 0.95s both;
      }

      /* Progress bar */
      .ls-bar-wrap {
        width: 170px;
        height: 2px;
        background: rgba(255,255,255,0.07);
        border-radius: 2px;
        overflow: hidden;
        margin-top: 30px;
        animation: ls-slide-up 0.5s ease 1.1s both;
      }
      .ls-bar {
        height: 100%;
        width: 0;
        background: linear-gradient(to right, #00468c 0%, #e5452b 60%, #ff6b4a 100%);
        border-radius: 2px;
        animation: ls-bar-fill 2.2s cubic-bezier(.25,.46,.45,.94) 0.4s forwards;
      }
      @keyframes ls-bar-fill {
        0%   { width: 0%;   }
        35%  { width: 48%;  }
        68%  { width: 76%;  }
        100% { width: 100%; }
      }

      @keyframes ls-slide-up {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0);    }
      }
    </style>
  </head>
  <body>

    <!-- ── Loading Screen ──────────────────────────── -->
    <div id="ls" role="status" aria-label="Loading Life Brand Church">

      <!-- Ambient glow -->
      <div class="ls-bg"></div>

      <!-- Cross of light -->
      <div class="ls-cross-v"></div>
      <div class="ls-cross-h"></div>

      <!-- Expanding light rings -->
      <div class="ls-ring"></div>
      <div class="ls-ring"></div>
      <div class="ls-ring"></div>

      <!-- Floating particles -->
      <div class="ls-particle" style="width:3px;height:3px;bottom:38%;left:44%;animation-duration:4.2s;animation-delay:0.3s;"></div>
      <div class="ls-particle" style="width:2px;height:2px;bottom:42%;left:55%;animation-duration:3.6s;animation-delay:1.1s;"></div>
      <div class="ls-particle" style="width:4px;height:4px;bottom:36%;left:48%;animation-duration:5.1s;animation-delay:0.7s;"></div>
      <div class="ls-particle" style="width:2px;height:2px;bottom:44%;left:52%;animation-duration:4.8s;animation-delay:1.9s;"></div>
      <div class="ls-particle" style="width:3px;height:3px;bottom:40%;left:46%;animation-duration:3.9s;animation-delay:2.4s;"></div>

      <!-- Centre content -->
      <div class="ls-center">
        <div class="ls-halo"></div>
        <img src="/images/header/logo.png" class="ls-logo" alt="Life Brand Church" onerror="this.style.display='none'">
        <div class="ls-name">Life Brand <em>Church</em></div>
        <div class="ls-sep">
          <div class="ls-sep-line"></div>
          <div class="ls-sep-dot"></div>
          <div class="ls-sep-line"></div>
        </div>
        <div class="ls-tagline">Giving&nbsp;&nbsp;Light</div>
        <div class="ls-bar-wrap">
          <div class="ls-bar"></div>
        </div>
      </div>

    </div>
    <!-- ───────────────────────────────────────────── -->

    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
